name: Build Onefile App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: app-windows
            ext: .exe
            nuitka-options: --windows-console-mode=disable
          - os: macos-latest
            artifact: app-macos
            ext: .bin
            nuitka-options: ""
          - os: ubuntu-22.04
            artifact: app-linux
            ext: .bin
            nuitka-options: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-randr0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 \
            libxkbcommon-x11-0 patchelf ccache

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Build onefile executable
        run: >
          python -m nuitka
          --onefile
          --assume-yes-download
          --output-dir=dist
          --include-data-files=src/gui/assets/=assets/
          ${{ matrix.nuitka-options }}
          src/gui/app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/app${{ matrix.ext }}
          retention-days: 14
