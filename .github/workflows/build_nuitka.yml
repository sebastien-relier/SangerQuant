name: Build Executables with Nuitka

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        mode: [standalone, onefile]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dev libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-shape0 libxcb-xfixes0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install nuitka
        shell: bash

      - name: Setup Ccache (Speed up compilation)
        uses: chbndrhnns/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.mode }}

      - name: Build with Nuitka (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          python -m nuitka --enable-plugin=pyqt6 \
            --assume-yes-for-downloads \
            --include-data-dir=icons=icons \
            --${{ matrix.mode }} \
            --windows-console-mode=disable \
            src/main.py
        shell: bash

      - name: Build with Nuitka (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m nuitka --enable-plugin=pyqt6 \
            --assume-yes-for-downloads \
            --include-data-dir=icons=icons \
            --${{ matrix.mode }} \
            src/main.py
        shell: bash

      - name: Build with Nuitka (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          python -m nuitka --enable-plugin=pyqt6 \
            --assume-yes-for-downloads \
            --include-data-dir=icons=icons \
            --${{ matrix.mode }} \
            --macos-create-app-bundle \
            src/main.py
        shell: bash

      - name: Prepare Artifacts (Standalone Mode)
        if: matrix.mode == 'standalone'
        run: |
          mkdir -p dist-package
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp -r src/main.dist dist-package/SangerQuant-Windows-Standalone
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp -r src/main.app dist-package/SangerQuant-Mac-AppBundle
          else
            cp -r src/main.dist dist-package/SangerQuant-Linux-Standalone
          fi
        shell: bash

      - name: Prepare Artifacts (Onefile Mode)
        if: matrix.mode == 'onefile'
        run: |
          mkdir -p dist-package
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv src/main.exe dist-package/SangerQuant.exe
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            mv src/main.onefile.app dist-package/SangerQuant-Mac-Onefile.app || mv src/main.app dist-package/SangerQuant-Mac-Onefile.app
          else
            mv src/main.bin dist-package/SangerQuant.bin
          fi
        shell: bash

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SangerQuant-${{ matrix.os }}-${{ matrix.mode }}
          path: dist-package/
          retention-days: 7
