name: Build SangerQuant Executables

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: SangerQuant-Linux
          - os: windows-latest
            artifact-name: SangerQuant-Windows
          - os: macos-latest
            artifact-name: SangerQuant-MacOS

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libxkbcommon-dev libglu1-mesa

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install nuitka

      - name: Setup Nuitka Cache Environment
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "NUITKA_CACHE_DIR=${{ github.workspace }}\.nuitka-cache" >> $GITHUB_ENV
          else
            echo "NUITKA_CACHE_DIR=${{ github.workspace }}/.nuitka-cache" >> $GITHUB_ENV
          fi

      - name: Restore Nuitka Build Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: ${{ runner.os }}-nuitka-${{ hashFiles('requirements.txt') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nuitka-${{ hashFiles('requirements.txt') }}-
            ${{ runner.os }}-nuitka-
      
      - name: Build Executable with Nuitka
        run: |
          mkdir -p dist_release
          python -m nuitka \
            --standalone \
            --onefile \
            --enable-plugin=pyqt6 \
            --include-data-dir=icons=icons \
            -o dist_release/sangerquant.exe \
            src/gui/app.py

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist_release/
          retention-days: 5
