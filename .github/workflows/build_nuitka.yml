
name: Build PyQt6 App (Nuitka)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MyApp-Windows
            binary: MyApp.exe
          - os: macos-latest
            artifact: MyApp-macOS
            binary: MyApp.app
          - os: ubuntu-latest
            artifact: MyApp-Linux
            binary: MyApp.bin

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-cursor0 libdbus-1-3 \
            libfontconfig1 libfuse2 patchelf ccache

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Build with Nuitka (Windows)
        if: runner.os == 'Windows'
        run: >
          python -m nuitka
          --standalone
          --onefile
          --windows-console-mode=disable
          --windows-icon-from-ico=assets/icon.ico
          --enable-plugin=pyside6
          --include-qt-plugins=all
          --output-filename=MyApp.exe
          --output-dir=build
          src/gui/main.py

      - name: Build with Nuitka (macOS)
        if: runner.os == 'macOS'
        run: >
          python -m nuitka
          --macos-create-app-bundle
          --macos-app-name=MyApp
          --macos-app-icon=assets/icon.icns
          --enable-plugin=pyside6
          --include-qt-plugins=all
          --output-dir=build
          src/gui/main.py

      - name: Build with Nuitka (Linux)
        if: runner.os == 'Linux'
        run: >
          python -m nuitka
          --standalone
          --onefile
          --enable-plugin=pyside6
          --include-qt-plugins=all
          --output-filename=MyApp.bin
          --output-dir=build
          src/gui/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/MyApp.exe
            build/MyApp.app/**
            build/MyApp.bin
          if-no-files-found: error
